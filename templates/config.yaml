runner: inline          # inline | subagent (runner_mode: parallel | combined, runner_model) | command (runner_command: [argv...], {root} substituted, prompt on stdin)
lenses: [structure]     # structure, acceptance, security, concurrency, isolation
backlog: none           # none | file (.agent-discipline/backlog.md, written by tdd-plan when it splits a request into stories)
router: none            # none | inert (skip security/concurrency on comment-only, new-test-only or rename-only changes)
commit: never           # never | on-request | on-green
commit_language: en     # language of commit subjects
commit_style: conventional  # conventional (<type>(<scope>): <subject>) | history (match the last 20 subjects)
# second_opinion_commands:  # candidates for --second (review, tdd-plan); the first whose program is not the running tool is used
#   - ["codex", "exec", "--ephemeral", "--sandbox", "read-only", "-C", "{root}"]
#   - ["claude", "-p", "--permission-mode", "plan"]
